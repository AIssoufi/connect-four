env:
  es6: true
  node: true
extends:
  - airbnb-base
globals:
  Atomics: readonly
  SharedArrayBuffer: readonly
parserOptions:
  ecmaVersion: 2018
  sourceType: module
rules: {}
overrides:
  - files:
      - '**/*.test.js'
    globals:
      # Built into Node.js since version 18, which ESLint 6 does not know.
      fetch: readonly
