env:
  es6: true
  node: true
extends:
  - airbnb-base
globals:
  Atomics: readonly
  SharedArrayBuffer: readonly
parserOptions:
  ecmaVersion: 2018
  sourceType: module
settings:
  # Modules of the Workers runtime, which only exist once the Worker runs.
  import/core-modules:
    - cloudflare:node
    - cloudflare:workers
rules: {}
overrides:
  # The page script runs in the browser as a classic script, not in Node.js.
  - files:
      - 'public/**/*.js'
    env:
      browser: true
      node: false
    parserOptions:
      sourceType: script
  - files:
      - '**/*.test.js'
    globals:
      # Built into Node.js since version 18, which ESLint 6 does not know.
      fetch: readonly
