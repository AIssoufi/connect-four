version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Gives a new release a week to be fixed or pulled before it is proposed
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # Its bump fails the tests until the API docs page follows, so it comes in its own PR
        exclude-patterns: ['swagger-ui-dist']
    # The major updates of npm go through tickets, such as #15 for ESLint
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
