name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Runs on master every Monday, so a new advisory fails the audit without waiting for a pull
  # request.
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its run; each push to master gets its own group, so
  # every master commit is checked.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reads the pnpm version from the packageManager field of package.json. Pinned to v6.1.0, the
      # first release that starts from pnpm 12 instead of 11: the v6 tag still points to v6.0.10.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub's dependency graph reads only the first YAML document of the pnpm 12 lockfile, so no
      # Dependabot security alert reaches the repository: this audit replaces them.
      - name: Audit the dependencies
        run: pnpm audit --audit-level moderate

      - name: Lint
        run: pnpm lint

      - name: Run the tests
        run: pnpm test

  test-other-node-versions:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest major release of Node.js that the engines field of package.json accepts and
        # the newest one released, besides the one of .nvmrc. Dependabot does not update this list:
        # add each new major release by hand.
        node-version: [22, 26]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reads the pnpm version from the packageManager field of package.json. Pinned to v6.1.0, the
      # first release that starts from pnpm 12 instead of 11: the v6 tag still points to v6.0.10.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the tests
        run: pnpm test
