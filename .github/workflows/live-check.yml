name: Live check

on:
  schedule:
    # Every day at 06:17 UTC, off the hour when GitHub delays the scheduled runs most: the full
    # check, with a game, however late it starts. FULL_CHECK below repeats this string: change
    # them together.
    - cron: '17 6 * * *'
    # Every hour at minutes 17 and 47: the files and the API docs only, with no game. GitHub drops
    # or delays many scheduled runs under load, so two hourly runs make a skipped one less likely
    # to leave the site unchecked for hours.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      host:
        description: The host to check, such as a wrong one to see the check fail.
        required: true
        default: connect-four.issoufi.fr
      files-only:
        description: Check the files and the API docs only, without starting a game.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-check:
    name: Check the live site and its API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The full check starts one game, which counts against the start rate limit: keep it daily.
      # The daily run starts its game however late GitHub starts it.
      - name: Request the site and the API
        env:
          # A scheduled run has no inputs: the script then checks its default host.
          HOST: ${{ inputs.host }}
          FILES_ONLY: ${{ inputs.files-only }}
          FULL_CHECK: ${{ github.event.schedule == '17 6 * * *' }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          options=()
          if [[ $IS_SCHEDULED == true && $FULL_CHECK != true ]]; then FILES_ONLY=true; fi
          if [[ $FILES_ONLY == true ]]; then options+=(--files-only); fi
          scripts/live-check.sh "${options[@]}" "$HOST"
