name: Live check

on:
  schedule:
    # Every day at 06:17 UTC, off the hour when GitHub delays the scheduled runs most.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      host:
        description: The host to check, such as a wrong one to see the check fail.
        required: true
        default: connect-four.issoufi.fr

permissions:
  contents: read

jobs:
  live-check:
    name: Check the live site and its API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Starts one game, which counts against the start rate limit: keep this workflow daily.
      - name: Request the site and the API
        env:
          # A scheduled run has no inputs: the script then checks its default host.
          HOST: ${{ inputs.host }}
        run: scripts/live-check.sh "$HOST"
