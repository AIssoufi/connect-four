# Only installs versions published at least 7 days ago (in minutes), so a compromised release is
# usually found and pulled before it can reach the lockfile
minimumReleaseAge: 10080
# pnpm itself is pinned on purpose by the packageManager field of package.json: without this
# exclusion, a local pnpm refuses to switch to a pinned version younger than 7 days
minimumReleaseAgeExclude:
  - pnpm
  - '@pnpm/*'
# A security fix that miniflare does not take yet: it pins an older undici exactly. Scoped to
# miniflare, so that jsdom keeps the undici 8 it asks for. Remove it once the lockfile installs a
# fixed version without it
overrides:
  'miniflare>undici': ^7.30.1
# Runs no install script of a dependency unless it is set to true here. The scripts of esbuild
# and workerd only check the binary of the optional package for the current platform, which pnpm
# installs anyway, and download it when that package is missing
allowBuilds:
  esbuild: false
  workerd: false
  # The install script of this dependency of swagger-ui-dist only sends usage analytics
  '@scarf/scarf': false
